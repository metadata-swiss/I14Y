description:
  en:
    localisedName: I14Y
    shortDescription: Swiss interoperability platform metadata catalog for public-sector datasets, APIs, and government services
    longDescription:
      I14Y is Switzerland's central directory for metadata about public-sector datasets,
      electronic interfaces (APIs), and government services. The platform publishes
      metadata only (not the underlying operational data), including access conditions,
      standards alignment, update and quality context. It supports harmonization through
      shared concepts and codelists, improves cross-administration data exchange, and
      contributes to the once-only principle by reducing duplicate data collection.
    documentation: https://i14y-ch.github.io/handbook/
    apiDocumentation: https://apiconsole.i14y.admin.ch/
    features:
      - Interoperability
