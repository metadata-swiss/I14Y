<app-description-view-template [dto]="dataService" [viewType]="viewTypeEnum.DataService" [publisherIdentifier]="publisherIdentifier">
    <div ngProjectAs="catalogues">
		@if (catalogues.length > 0) {
			<div class="property">
				<h3 class="catalogues-title">{{ "i18n.title.catalogues" | translate }}</h3>
				<div class="value" id="description-catalogues">
					@for (catalog of catalogues; track catalog.catalogId) {
						@let catalogTitle = catalog.catalogTitle | fallback: currentLanguage;
						<div id="description-catalogTitle-{{ catalog.catalogId }}">{{ catalogTitle ?? emptyPlaceHolder }}</div>
					}
				</div>
			</div>
		}
	</div>
</app-description-view-template>
