@if (results && pagingInfo) {
	<div class="ob-grid">
		<div class="ob-span-6">
			<h3>{{ "i18n.title.search_results" | translate }} ({{ pagingInfo.totalRows }})</h3>
			@if (pagingInfo.totalRows > 0) {
				@for (result of results; track result) {
					<div>
						<app-content-search-result-item [result]="result" [filterLanguage]="filterLanguage"></app-content-search-result-item>
					</div>
				}
				<mat-paginator
					[length]="pagingInfo.totalRows"
					[pageSizeOptions]="pagingInfo.pageSizeOptions"
					[pageSize]="pagingInfo.pageSize"
					[pageIndex]="pagingInfo.page - 1"
					(page)="onChangePage($event)"
				></mat-paginator>
			} @else {
				<ob-alert type="info">{{ "i18n.info.no_results_part_one" | translate }}<br />{{ "i18n.info.no_results_part_two" | translate }}</ob-alert>
			}
		</div>
		<div class="ob-span-6">
			<app-codelistentry-detail></app-codelistentry-detail>
		</div>
	</div>
}
