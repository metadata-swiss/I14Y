<div class="table-wrapper">
	<div class="detail-table-row-wrapper">
		<table mat-table class="ob-table ob-table-plain" [dataSource]="dataSource" multiTemplateDataRows aria-label="table">
			<ng-container [matColumnDef]="COLUMN_DATASET">
				<th mat-header-cell *matHeaderCellDef>
					{{ "i18n.title.dataset" | translate }}
				</th>
				<td mat-cell *matCellDef="let element">
					<a [href]="element.datasetUri" [target]="target" [rel]="rel" [icon]="element.datasetUri | linkicon">{{ element.datasetName | fallback: currentLanguage }}</a>
				</td>
			</ng-container>

			<ng-container [matColumnDef]="COLUMN_ATTRIBUTE">
				<th mat-header-cell *matHeaderCellDef>
					{{ "i18n.title.attributes" | translate }}
				</th>
				<td mat-cell *matCellDef="let element">
					<a [href]="element.attributeUri" [target]="target" [rel]="rel" [icon]="element.attributeUri | linkicon">{{ element.attributeName }}</a>
				</td>
			</ng-container>

			<ng-container [matColumnDef]="COLUMN_PUBLISHER">
				<th mat-header-cell *matHeaderCellDef>
					{{ "i18n.property.publisher" | translate }}
				</th>
				<td mat-cell *matCellDef="let element">
					{{ element.publisherName | fallback: currentLanguage }}
				</td>
			</ng-container>

			<tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
			<tr mat-row *matRowDef="let element; columns: displayedColumns"></tr>
		</table>
		<mat-paginator
			[length]="pagingInfo.totalRows"
			[pageSizeOptions]="pagingInfo.pageSizeOptions"
			[pageSize]="pagingInfo.pageSize"
			[pageIndex]="pagingInfo.page - 1"
			(page)="onChangePage($event)"
		></mat-paginator>
	</div>
</div>
