@if (resources?.length > 0 || forceDisplay) {
	<app-detail-table-row [label]="label" [id]="id">
		@if (!resources || resources.length === 0) {
			<div>-</div>
		}
		@for (resource of getOrderedRessources(); track resource) {
			<div>
				<a href="{{ resource.uri }}" target="_blank" rel="noopener noreferrer" [icon]="resource.uri | linkicon">{{ (resource.label | fallback: currentLang) ?? resource.uri }}</a>
			</div>
		}
	</app-detail-table-row>
}
