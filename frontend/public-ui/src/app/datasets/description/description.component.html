<app-description-view-template
	[dto]="dataset"
	[viewType]="viewTypeEnum.Dataset"
	[hasIsServedBy]="isServedBy.length > 0"
	[publisherIdentifier]="publisherIdentifier"
>
	<div ngProjectAs="property-is-served-by">
		@if (isServedBy.length > 0) {
			<div class="property">
				<div class="label">{{ "i18n.property.is_served_by.label" | translate }}</div>
				<div class="value" id="description-is-served-by">
					@for (dataService of isServedBy; track dataService) {
						<div>
							@let title = dataService.title | extendedfallback: currentLanguage;
							<a
								id="description-is-served-by-{{ dataService.id }}"
								[routerLink]="['../../../dataservices/', dataService.id]"
								routerLinkActive="router-link-active"
								[attr.lang]="title && title.cultureCode !== currentLanguage ? title.cultureCode : null"
								>{{ title?.text }}</a
							>
						</div>
					}
				</div>
			</div>
		}
	</div>
	<div ngProjectAs="distributions-table">
		<app-distributions-overview [data]="dataset?.distributions"></app-distributions-overview>
	</div>
</app-description-view-template>
