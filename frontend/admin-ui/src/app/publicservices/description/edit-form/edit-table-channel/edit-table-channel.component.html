<table
	aria-label="table"
	mat-table
	class="ob-table ob-table-plain no-link-decoration"
	id="channel-table"
	matSort
	[dataSource]="dataSource"
	(matSortChange)="sortData($event)"
>
	<ng-container [matColumnDef]="COLUMN_SELECT">
		<th mat-header-cell *matHeaderCellDef>
			<mat-checkbox
				id="linked-with-checkbox-all"
				(change)="$event ? onMasterToggle() : null"
				[checked]="hasSelectedRows() && isAllSelected()"
				[indeterminate]="hasSelectedRows() && !isAllSelected()"
				matTooltip="{{ 'i18n.tooltip.checkbox_all' | translate }}"
			>
			</mat-checkbox>
		</th>
		<td mat-cell *matCellDef="let row">
			<mat-checkbox
				id="linked-with-checkbox-single"
				(click)="$event.stopPropagation()"
				(change)="$event ? onToggleSelection(row) : null"
				[checked]="isRowSelected(row)"
				matTooltip="{{ 'i18n.tooltip.checkbox_single' | translate }}"
			>
			</mat-checkbox>
		</td>
	</ng-container>
	<ng-container [matColumnDef]="COLUMN_IDENTIFIER">
		<th mat-header-cell mat-sort-header *matHeaderCellDef>
			{{ "i18n.property.identifier" | translate }}
		</th>
		<td mat-cell *matCellDef="let element; let i = index" title="Title" id="detail-identifier-{{ i }}">
			{{ element.identifier }}
		</td>
	</ng-container>

	<ng-container [matColumnDef]="COLUMN_TYPE">
		<th mat-header-cell mat-sort-header *matHeaderCellDef>
			{{ "i18n.property.channel_type" | translate }}
		</th>
		<td mat-cell *matCellDef="let element; let i = index" title="Format" id="detail-type-{{ i }}">
			{{ element.type?.name | fallback : currentLanguage }}
		</td>
	</ng-container>

	<ng-container [matColumnDef]="COLUMN_OWNEDBY">
		<th mat-header-cell mat-sort-header *matHeaderCellDef>
			{{ "i18n.property.owned_by" | translate }}
		</th>
		<td mat-cell *matCellDef="let element; let i = index" title="Size" id="detail-ownedby-{{ i }}">
			{{ getOwnedBy(element) }}
		</td>
	</ng-container>

	<ng-container [matColumnDef]="COLUMN_ACTIONS">
		<th mat-header-cell *matHeaderCellDef>
			<div class="action-wrapper">
				<div class="action-button">
					<button
						id="{{ 'channel-deleteSelected-row' }}"
						obButton="secondary"
						mat-icon-button
						matTooltip="{{ 'i18n.tooltip.delete_selected' | translate }}"
						(click)="onRemoveSelectedRows()"
						[disabled]="!hasSelectedRows()"
						type="button"
					>
						<mat-icon svgIcon="delete" class="ob-icon"></mat-icon>
					</button>
				</div>
				<div class="action-button">
					<button
						id="{{ 'channel-add-row' }}"
						obButton="secondary"
						mat-icon-button
						(click)="onAddRow()"
						[disabled]="hasSelectedRows()"
						matTooltip="{{ 'i18n.tooltip.addrow' | translate }}"
						type="button"
					>
						<mat-icon svgIcon="plus" class="ob-icon"></mat-icon>
					</button>
				</div>
			</div>
		</th>
		<td mat-cell *matCellDef="let element; let i = index">
			<div class="action-wrapper">
				<div class="action-button">
					<button
						id="channel-edit-button-{{ i }}"
						obButton="secondary"
						mat-icon-button
						matTooltip="{{ 'i18n.tooltip.edit' | translate }}"
						[disabled]="hasSelectedRows()"
						(click)="onEditRow(element)"
					>
						<mat-icon svgIcon="pencil" class="ob-icon"></mat-icon>
					</button>
				</div>
				<div class="action-button">
					<button
						id="channel-remove-button-{{ i }}"
						obButton="secondary"
						mat-icon-button
						[disabled]="hasSelectedRows()"
						matTooltip="{{ 'i18n.button.remove.tooltip' | translate }}"
						type="button"
						(click)="onRemoveRow(element)"
					>
						<mat-icon svgIcon="delete" class="ob-icon"></mat-icon>
					</button>
				</div>
			</div>
		</td>
	</ng-container>

	<tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
	<tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>

<div class="table-info-box">
	<app-infobox-no-content [datasource]="dataSource.data"></app-infobox-no-content>
</div>
