<div [formGroup]="spatialForm" id="spatial-form">
  <div formArrayName="spatials">
    @for (item of items().controls; track item; let i = $index) {
      <div class="ob-grid">
        <div [formGroupName]="i" class="ob-span-9">
          <mat-form-field>
            <mat-label>{{ "i18n.property.spatial_coverage" | translate }}</mat-label>
            <input id="input-spatial-{{ i }}" type="text" matInput formControlName="spatial" />
          </mat-form-field>
        </div>
        <div class="ob-span-3 action-button-wrapper">
          @if (i === 0) {
            <button (click)="addControl()" mat-button obButton="secondary" type="button">
              <mat-icon svgIcon="plus" class="ob-icon"></mat-icon> {{ "i18n.edit_spatial_coverage.add" | translate }}
            </button>
          }
          @if (i > 0) {
            <button (click)="removeControl(i)" mat-button obButton="secondary" type="button">
              <mat-icon svgIcon="delete" class="ob-icon"></mat-icon> {{ "i18n.edit_spatial_coverage.delete" | translate }}
            </button>
          }
        </div>
      </div>
    }
  </div>
</div>
