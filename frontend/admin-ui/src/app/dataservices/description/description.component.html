<app-description-view-template
	[dto]="dataservice"
	[viewType]="viewTypeEnum.DataService"
	[nextVersions]="nextVersions"
	[previousVersion]="previousVersion"
	[servesDatasets]="servesDatasets"
>
	<div ngProjectAs="catalogues">
		@if (catalogues.length > 0) {
			@for (ca of catalogues; track ca.catalogId; let last = $last) {
				<span id="description-catalogTitle-{{ ca.catalogId }}">{{ (ca.catalogTitle | fallback: currentLanguage) ?? "-" }}</span
				>{{ !last ? ", " : "" }}
			}
		} @else {
			-
		}
	</div>
</app-description-view-template>
