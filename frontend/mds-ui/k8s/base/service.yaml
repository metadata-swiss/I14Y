apiVersion: v1
kind: Service
metadata:
  name: mds-ui
spec:
  # Inside the cluster only. How the site is reached from outside (ingress, public or internal load balancer)
  # is not decided yet; for testing use: kubectl port-forward svc/mds-ui 3000:80
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
