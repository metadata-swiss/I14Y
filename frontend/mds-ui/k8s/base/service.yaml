apiVersion: v1
kind: Service
metadata:
  name: mds-ui
spec:
  # Inside the cluster only. Each overlay makes it an internal load balancer behind the Application Gateway, which
  # holds the domain and the TLS certificate; the cluster has no ingress controller. See overlays/dev.
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
