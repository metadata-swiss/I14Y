backend:
  name: github
  repo: opendata-swiss/opendata-swiss-cms-content-test
  squash_merges: true

publish_mode: editorial_workflow

media_folder: "assets"
public_folder: "/cms"

i18n:
  structure: multiple_files
  default_locale: de
  locales: [de, fr, it, en]

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: handbook
    label: "Handbook articles"
    label_singular: Handbook article
    identifier_field: id
    folder: handbook
    extension: md
    widget: "list"
    create: true
    i18n: true
    summary: "{{title}}"
    view_groups:
      - label: Parent
        field: parent
    path: "{{parent}}/{{slug}}"
    sortable_fields:
      - title
    fields:
      - label: Active
        name: active
        widget: boolean
        default: true
        i18n: duplicate
        required: false
      - label: Title
        name: title
        widget: string
        required: true
        i18n: true
      - label: Breadcrumb title
        name: breadcrumb_title
        widget: string
        required: false
        i18n: true
      - label: Slug
        name: slug
        widget: string
        i18n: duplicate
        pattern:
          [
            "^[a-z0-9-]+$",
            "Slug must be lowercase and can only contain letters, numbers, and hyphens.",
          ]
      - label: Parent article
        name: parent
        widget: relation
        collection: handbook
        value_field: "{{slug}}"
        display_fields:
          - "{{parent}} - {{title}}"
        search_fields:
          - "title"
        i18n: duplicate
        required: false
      - name: after
        label: After
        widget: relation
        collection: handbook
        value_field: "{{slug}}"
        display_fields:
          - "{{parent}} - {{title}}"
        search_fields:
          - "title"
        i18n: duplicate
        required: false
      - &publicationDate
        name: publicationDate
        label: Publication date
        widget: datetime
        default: ""
        i18n: duplicate
        required: false
        format: 'YYYY-MM-DDTHH:mm:ssZZ'
      - name: body
        label: Body
        widget: markdown
        i18n: true

  - name: pages
    label: "Pages"
    label_singular: Page
    folder: pages
    extension: md
    widget: "list"
    create: true
    i18n: true
    view_groups:
      - label: Shown in Main Menu
        field: mainMenu
    fields:
      - label: Title
        name: title
        widget: string
        required: true
        i18n: true
      - label: Heading
        name: heading
        widget: string
        i18n: true
        required: false
      - label: Sub-heading
        name: subHeading
        widget: markdown
        i18n: true
        required: false
      - name: heroImage
        label: Image displayed on the top of the page
        widget: image
        i18n: duplicate
        required: false
      - name: parent
        label: Parent page
        widget: relation
        collection: pages
        value_field: "{{slug}}"
        search_fields:
          - "title"
        i18n: duplicate
        required: false
      - name: mainMenu
        label: Show in main menu
        widget: boolean
        default: true
        i18n: duplicate
        required: false
      - name: fullWidth
        label: Disables sidebar
        widget: boolean
        default: false
        i18n: duplicate
        required: false
      - name: after
        label: After
        widget: relation
        collection: pages
        value_field: "{{slug}}"
        display_fields:
          - "{{title}}"
        search_fields:
          - "title"
        i18n: duplicate
        required: false
      - *publicationDate
      - name: body
        label: Body
        widget: markdown
        i18n: true

  - name: blog
    label: Blog
    label_singular: Blog Post
    folder: blog
    extension: md
    widget: "list"
    create: true
    i18n: true
    fields:
      - label: Pinned
        name: pinned
        widget: boolean
        default: true
        i18n: duplicate
        required: false
      - label: Title
        name: title
        widget: string
        required: true
        i18n: true
      - label: Slug
        name: slug
        widget: string
        i18n: false
        required: false
        pattern:
          [
            "^[a-z0-9-]+(?:/[a-z0-9-]+)*$",
            "Permalink must be lowercase and can only contain letters, numbers, slashes, and hyphens.",
          ]
      - label: Date
        name: date
        widget: datetime
        i18n: duplicate
        default: "{{now}}"
      - *publicationDate
      - name: subHeading
        label: Subheading
        widget: markdown
        i18n: true
      - name: image
        label: Image
        widget: image
        i18n: true
        required: true
      - name: body
        label: Body
        widget: markdown
        i18n: true

  - name: Showcases
    label: "Showcases"
    label_singular: Showcase
    folder: showcases
    i18n: true
    extension: md
    widget: "list"
    create: true
    fields:
      - label: Active
        name: active
        widget: boolean
        default: true
        i18n: duplicate
        required: false
      - label: Pinned
        name: pinned
        widget: boolean
        default: true
        i18n: duplicate
        required: false
      - label: Title
        name: title
        widget: string
        i18n: true
      - label: Images
        name: images
        hint: Drag to reorder. Top image will be used as cover image.
        widget: list
        i18n: false
        min: 1
        max: 1000
        collapsed: true
        fields:
          - label: Image
            name: image
            widget: image
      - label: Website
        name: url
        widget: string
        i18n: duplicate
        required: false
      - *publicationDate
      - label: Relationships
        name: relationships
        i18n: false
        required: false
        widget: list
        types:
          - label: Organization
            name: organization
            widget: object
            summary: '{{fields.organization}} ({{fields.role}})'
            fields:
              - label: Organization
                name: organization
                widget: list
                hint: The organization's identifier in iop-core and its name.
                summary: '{{fields.label}}'
                fields:
                  - { label: Identifier, name: id, widget: string }
                  - { label: Name, name: label, widget: string }
              - &role_field
                label: Role
                name: role
                widget: select
                hint: Extracted from http://inspire.ec.europa.eu/metadata-codelist/ResponsiblePartyRole
                options:
                  - label: Author
                    value: author
                  - label: Custodian
                    value: custodian
                  - label: Distributor
                    value: distributor
                  - label: Originator
                    value: originator
                  - label: Owner
                    value: owner
                  - label: Point of contact
                    value: pointOfContact
                  - label: Principal investigator
                    value: principalInvestigator
                  - label: Processor
                    value: processor
                  - label: Publisher
                    value: publisher
                  - label: Resource provider
                    value: resourceProvider
                  - label: User
                    value: user
          - label: External organization
            name: organization-external
            widget: object
            summary: '{{fields.name}} ({{fields.role}})'
            fields:
              - label: Name
                name: name
                widget: string
              - name: url
                label: Url (separate multiple entries with a comma)
                widget: list
                required: false
              - *role_field
          - label: Person
            name: person
            widget: object
            summary: '{{fields.name}} ({{fields.role}})'
            fields:
              - label: Name
                name: name
                widget: string
              - label: GitHub
                name: github
                widget: string
                required: false
              - *role_field
      # The I14Y themes (iop-core vocabulary Concept_DATASET_THEME), stored as their codes, like the themes of
      # the other iop-core resources. Showcases written before 2026-10-16 still have EU data theme URIs.
      - label: Themes
        name: themes
        widget: select
        multiple: true
        i18n: duplicate
        options:
          - label: Labour
            value: '101'
          - label: Construction
            value: '102'
          - label: Education
            value: '103'
          - label: External relations
            value: '104'
          - label: Jurisdiction
            value: '105'
          - label: Society
            value: '106'
          - label: Political activities
            value: '107'
          - label: Culture
            value: '108'
          - label: Agriculture
            value: '109'
          - label: Infrastructure
            value: '110'
          - label: Security
            value: '111'
          - label: Taxes
            value: '112'
          - label: Environment
            value: '113'
          - label: Health
            value: '114'
          - label: Economy
            value: '115'
          - label: Mobility
            value: '116'
          - label: Citizens
            value: '117'
          - label: Businesses
            value: '118'
          - label: Authorities
            value: '119'
          - label: Buildings and land
            value: '120'
          - label: Animals
            value: '121'
          - label: Geoinformation
            value: '122'
          - label: Compilation of laws
            value: '123'
          - label: Energy
            value: '124'
          - label: Official statistics
            value: '125'
          - label: Social security
            value: '126'
      # The showcase types; their labels on the website are translations (message.showcase.type.*).
      - label: Type of content
        name: type
        widget: select
        i18n: duplicate
        options:
          - label: Application
            value: https://opendata.swiss/vocabulary/showcase-type/application
          - label: Data visualization
            value: https://opendata.swiss/vocabulary/showcase-type/data_visualization
      - name: datasets
        label: Datasets
        widget: list
        i18n: duplicate
        required: false
        hint: The dataset's identifier in iop-core (the last part of its address on the website) and its title.
        summary: '{{fields.label}}'
        fields:
          - { label: Identifier, name: id, widget: string }
          - { label: Title, name: label, widget: string }
      - name: keywords
        label: Keywords
        widget: list
        i18n: true
      - name: createdBy
        label: Created by
        widget: string
        i18n: duplicate
      - name: more
        label: Additional submission details
        widget: object
        summary: '{{fields.name}}'
        i18n: false
        required: false
        collapsed: true
        fields:
          - name: whoAreYou
            label: Who are you?
            widget: string
            required: false
          - name: goal
            label: What is the goal of your showcase in one sentence?
            widget: string
            required: false
          - name: why
            label: Why did you use this specific data?
            widget: string
            required: false
          - name: users
            label: Who are the end users?
            widget: string
            required: false
          - name: challengesBefore
            label: What challenges did end users face BEFORE using your showcase?
            widget: string
            required: false
          - name: challengesCreating
            label: What challenges did YOU face in creating this showcase?
            widget: string
            required: false
          - name: getMost
            label: What should the user do to get the most out of this showcase?
            widget: string
            required: false
          - name: anythingElse
            label: Would you like to add anything else?
            widget: string
            required: false
      - name: body
        label: Body
        widget: markdown
        i18n: true
        required: false
