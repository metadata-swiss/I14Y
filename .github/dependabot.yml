version: 2

# Dependabot only opens PRs for high and critical security alerts.
#
# - Version updates are off: open-pull-requests-limit 0 disables them and does not
#   affect security updates. Dependencies are upgraded by hand.
# - Which alerts get a PR is decided by a custom auto-triage rule in the repository
#   settings (Settings > Advanced Security > Dependabot rules: severity high, critical
#   -> open a pull request). That rule only takes effect while the repository-wide
#   "Dependabot security updates" toggle is off.
# - The entries below stay so that security PRs are grouped: one PR per ecosystem
#   instead of one per package and directory.
updates:
  # .NET dependencies in the backend and end-to-end test projects.
  - package-ecosystem: "nuget"
    directories:
      - "/backend/**"
      - "/tests/**"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    groups:
      nuget-security:
        applies-to: security-updates
        patterns: ["*"]

  # npm dependencies for both Angular applications.
  - package-ecosystem: "npm"
    directories:
      - "/frontend/admin-ui"
      - "/frontend/public-ui"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  # Actions referenced by workflows in .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
