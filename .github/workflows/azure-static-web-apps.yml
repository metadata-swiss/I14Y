name: ABN_PROD_Azure Static Web Apps CI/CD

on:
  release:
    types: [published]

  push:
    branches: [release/*, Release/*, releases/*, Releases/*]

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      tag:
        description: "Enter the tag version you want to deploy (e.g. v1.2.3)"
        required: true
        type: string

jobs:
  build_and_deploy_job_ABN:
    environment: ABN
    runs-on: ubuntu-latest
    name: Build and Deploy ABN
    permissions:
      id-token: write
      contents: read
    env:
      GITHUB_TOKEN: ${{ secrets.DEPLOYMENT_ACTION_KEY}}
      ENV_NAME: ${{vars.ENV_NAME}}
      ADMIN_APP_ROUTE: ${{vars.ADMIN_APP_ROUTE}}
      ANALYTICS_SITE_ID: ${{vars.ANALYTICS_SITE_ID}}
      DASHBOARD_URL: ${{vars.DASHBOARD_URL}}
      API_BASE_URL: ${{vars.API_BASE_URL}}
      LINK_HANDBOOK: ${{vars.LINK_HANDBOOK}}
      PUBLIC_API_BASE_URL: ${{vars.PUBLIC_API_BASE_URL}}
      SHOW_INFO_VIDEO: ${{vars.SHOW_INFO_VIDEO}}
      I14Y_IRI_URL: ${{vars.I14Y_IRI_URL}}

    steps:
      - name: Check out code from release
        if: github.event_name == 'release'
        uses: actions/checkout@v5
        with:
          submodules: true
          ref: ${{ github.event.release.tag_name }}

      - name: Check out code from release branch
        if: (startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/releases/')) && github.event_name == 'push'
        uses: actions/checkout@v5
        with:
          submodules: true
          ref: ${{ github.ref_name }}

      - name: Check out code from tag
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag }}


      - name: Get OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            return token;
          result-encoding: string

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          check-latest: true
          cache: "npm"

      - name: Replace variable in appconfig
        run: |
          node -e "
          const fs = require('fs');
          const path = './src/assets/config/appconfig.token.json';
          const outPath = './src/assets/config/appconfig.json';
          let config = fs.readFileSync(path, 'utf8');
          const matches = config.match(/__([A-Z0-9_]+)__/g) || [];
          matches.forEach(token => {
            const varName = token.replace(/__/g, '');
            const value = process.env[varName];
            if (value) {
              console.log(\`Replacing \${token} with value from env \${varName}\`);
              config = config.replace(new RegExp(token, 'g'), value);
            } else {
              console.warn(\`⚠️ Environment variable \${varName} not found, leaving token as-is.\`);
            }
          });
          fs.writeFileSync(outPath, config);
          console.log('✅ Generated', outPath);
          "

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Angular
        run: |
          npm run build-prod;
          cp staticwebapp.config.json dist/;
          test -f dist/index.html

      - name: Install Azure Static Web Apps CLI
        run: npm install -g @azure/static-web-apps-cli

      - name: Deploy to Azure Static Web App
        env:
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          echo "🚀 Starting Azure Static Web App deployment..."
          set -e  # stop script on any unhandled error

          # Deploy and capture log
          swa deploy "dist" \
            --env prod \
            --deployment-token "$AZURE_STATIC_WEB_APPS_API_TOKEN" \
            --verbose > deploy.log 2>&1
            # Check log for "deployed"
            if grep -q "deployed" deploy.log; then
              echo "✅ Deployment completed successfully."
            else
              echo "❌ Deployment failed. Last 40 lines of log:"
              tail -n 40 deploy.log
              exit 1  # mark step as failed
            fi

      - name: Upload npm logs artifact
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: npm-logs-abn
          path: ~/.npm/_logs/
          if-no-files-found: ignore
          retention-days: 3

  build_and_deploy_job_PROD:
    environment: PROD
    runs-on: ubuntu-latest
    name: Build and Deploy PROD
    needs: [build_and_deploy_job_ABN]
    permissions:
      id-token: write
      contents: read
    env:
      GITHUB_TOKEN: ${{ secrets.DEPLOYMENT_ACTION_KEY}}
      ENV_NAME: ${{vars.ENV_NAME}}
      ADMIN_APP_ROUTE: ${{vars.ADMIN_APP_ROUTE}}
      ANALYTICS_SITE_ID: ${{vars.ANALYTICS_SITE_ID}}
      DASHBOARD_URL: ${{vars.DASHBOARD_URL}}
      API_BASE_URL: ${{vars.API_BASE_URL}}
      LINK_HANDBOOK: ${{vars.LINK_HANDBOOK}}
      PUBLIC_API_BASE_URL: ${{vars.PUBLIC_API_BASE_URL}}
      SHOW_INFO_VIDEO: ${{vars.SHOW_INFO_VIDEO}}
      I14Y_IRI_URL: ${{vars.I14Y_IRI_URL}}

    steps:
      - name: Check out code from release
        if: github.event_name == 'release'
        uses: actions/checkout@v5
        with:
          submodules: true
          ref: ${{ github.event.release.tag_name }}

      - name: Check out code from release branch
        if: startsWith(github.ref, 'refs/heads/release/') && github.event_name == 'push'
        uses: actions/checkout@v5
        with:
          submodules: true
          ref: ${{ github.ref_name }}

      - name: Check out code from tag
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Get OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            return token;
          result-encoding: string

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          check-latest: true
          cache: "npm"

      - name: Replace variable in appconfig
        run: |
          node -e "
          const fs = require('fs');
          const path = './src/assets/config/appconfig.token.json';
          const outPath = './src/assets/config/appconfig.json';
          let config = fs.readFileSync(path, 'utf8');
          const matches = config.match(/__([A-Z0-9_]+)__/g) || [];
          matches.forEach(token => {
            const varName = token.replace(/__/g, '');
            const value = process.env[varName];
            if (value) {
              console.log(\`Replacing \${token} with value from env \${varName}\`);
              config = config.replace(new RegExp(token, 'g'), value);
            } else {
              console.warn(\`⚠️ Environment variable \${varName} not found, leaving token as-is.\`);
            }
          });
          fs.writeFileSync(outPath, config);
          console.log('✅ Generated', outPath);
          "


      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Angular
        run: |
          npm run build-prod;
          cp staticwebapp.config.json dist/;
          test -f dist/index.html

      - name: Install Azure Static Web Apps CLI
        run: npm install -g @azure/static-web-apps-cli

      - name: Deploy to Azure Static Web App
        env:
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          echo "🚀 Starting Azure Static Web App deployment..."
          set -e  # stop script on any unhandled error

          # Deploy and capture log
          swa deploy "dist" \
            --env prod \
            --deployment-token "$AZURE_STATIC_WEB_APPS_API_TOKEN" \
            --verbose > deploy.log 2>&1
            # Check log for "deployed"
            if grep -q "deployed" deploy.log; then
              echo "✅ Deployment completed successfully."
            else
              echo "❌ Deployment failed. Last 40 lines of log:"
              tail -n 40 deploy.log
              exit 1  # mark step as failed
            fi

      - name: Upload npm logs artifact
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: npm-logs-prod
          path: ~/.npm/_logs/
          if-no-files-found: ignore
          retention-days: 7
