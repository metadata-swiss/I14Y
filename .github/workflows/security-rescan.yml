name: Security Rescan

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: security-rescan
  cancel-in-progress: true

env:
  ARTIFACT_RETENTION_DAYS: "30"
  TRIVY_VERSION: "0.69.2"
  TRIVY_LINUX_X64_SHA256: "affa59a1e37d86e4b8ab2cd02f0ab2e63d22f1bf9cf6a7aa326c884e25e26ce3"

jobs:
  dotnet-dependencies:
    name: .NET dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v5
        with:
          dotnet-version: 10.0.x

      - name: Restore backend solution
        run: dotnet restore backend/i14y.slnx

      - name: Report vulnerable .NET dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/quality-gates"
          dotnet list backend/i14y.slnx package --vulnerable --include-transitive --format json \
            > "$RUNNER_TEMP/quality-gates/backend-vulnerabilities.json"

      - name: Retain .NET dependency report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-rescan-backend-vulnerabilities
          path: ${{ runner.temp }}/quality-gates/backend-vulnerabilities.json
          if-no-files-found: warn
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Enforce critical .NET dependency vulnerabilities
        run: >-
          python3 .github/scripts/quality-gates/evaluate_dotnet_vulnerabilities.py
          --input "${{ runner.temp }}/quality-gates/backend-vulnerabilities.json"
          --block-at critical
          --warn-at high

  npm-dependencies:
    name: (${{ matrix.app }}) npm dependency vulnerabilities
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [admin-ui, public-ui]
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Report npm dependency vulnerabilities
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/quality-gates"
          npm audit --package-lock-only --json --audit-level=critical | tee "$RUNNER_TEMP/quality-gates/${{ matrix.app }}-npm-audit.json"

      - name: Retain npm dependency report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-rescan-${{ matrix.app }}-npm-audit
          path: ${{ runner.temp }}/quality-gates/${{ matrix.app }}-npm-audit.json
          if-no-files-found: warn
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Annotate npm dependency vulnerabilities
        if: always()
        shell: bash
        run: |
          report="$RUNNER_TEMP/quality-gates/${{ matrix.app }}-npm-audit.json"
          if [[ ! -f "$report" ]]; then
            echo "::error::npm audit did not produce a report for ${{ matrix.app }}."
            exit 1
          fi
          jq -r --arg app "${{ matrix.app }}" '
            .vulnerabilities // {}
            | to_entries[]
            | select(.value.severity == "critical" or .value.severity == "high")
            | .key as $package
            | .value.severity as $severity
            | ([.value.via[]? | select(type == "object" and .severity == $severity) | .url] | unique | if length == 0 then "unknown advisory" else join(", ") end) as $advisories
            | (if $severity == "critical" then "error" else "warning" end) as $level
            | "::\($level) title=\($severity | ascii_upcase) npm vulnerability (\($app))::[\($app)] npm package \($package) has a \($severity) vulnerability: \($advisories)"
          ' "$report"

      - name: Enforce critical npm dependency vulnerabilities
        if: always() && steps.audit.outcome == 'failure'
        shell: bash
        run: exit 1

  container-images:
    name: (${{ matrix.component }}) Backend docker image vulnerabilities
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [core, admin, partner, iri, audittrail, indexsearch]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Install pinned Trivy binary
        shell: bash
        run: |
          install_dir="$RUNNER_TEMP/trivy"
          archive="$RUNNER_TEMP/trivy.tar.gz"
          mkdir -p "$install_dir"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_LINUX_X64_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$install_dir" trivy
          chmod +x "$install_dir/trivy"

      - name: Build backend image locally
        env:
          IMAGE_TAG: security-rescan-${{ github.sha }}
        shell: bash
        run: |
          docker build . \
            --file "docker/Dockerfile.${{ matrix.component }}" \
            --tag "i14y-security-rescan/${{ matrix.component }}:${IMAGE_TAG}" \
            --build-arg ASSEMBLY_VERSION="0.0.0" \
            --build-arg INFORMATIONAL_VERSION="security-rescan-${GITHUB_SHA}" \
            --build-arg DOCKER_VERSION="0.0.0-security-rescan"

      - name: Scan backend image with Trivy
        env:
          IMAGE_TAG: security-rescan-${{ github.sha }}
          REPORT_DIRECTORY: ${{ runner.temp }}/quality-gates/trivy
        shell: bash
        run: |
          mkdir -p "$REPORT_DIRECTORY"
          "$RUNNER_TEMP/trivy/trivy" image \
            --skip-version-check \
            --disable-telemetry \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --format sarif \
            --output "$REPORT_DIRECTORY/${{ matrix.component }}.sarif" \
            "i14y-security-rescan/${{ matrix.component }}:${IMAGE_TAG}"

      - name: Upload image SARIF
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: ${{ runner.temp }}/quality-gates/trivy/${{ matrix.component }}.sarif
          category: trivy-images-${{ matrix.component }}

      - name: Retain Trivy report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-rescan-trivy-${{ matrix.component }}-sarif
          path: ${{ runner.temp }}/quality-gates/trivy/${{ matrix.component }}.sarif
          if-no-files-found: warn
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Enforce Trivy policy
        shell: bash
        run: |
          python3 .github/scripts/quality-gates/evaluate_sarif.py \
            --input "$RUNNER_TEMP/quality-gates/trivy/${{ matrix.component }}.sarif" \
            --minimum-security-severity 9.0 \
            --warning-minimum-security-severity 7.0 \
            --label "Trivy image scan (${{ matrix.component }})"
