name: Build Validation before merge

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

  # Allow manual trigger
  workflow_dispatch:

jobs:
  # -------------------------------
  # Build Validation Job (for PRs)
  # -------------------------------
  validate_build:
    name: Validate_Build (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      GITHUB_TOKEN: ${{ secrets.DEPLOYMENT_ACTION_KEY}}
    permissions:
      contents: read
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

#      - name: Lint codebase
#        run: npm run lint

      - name: Build Angular (validation)
        run: npm run build-prod

      - name: Verify build output
        run: test -f dist/index.html
