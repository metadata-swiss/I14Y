name: i14y-backend | Deploy to ABN & PRD

run-name: "Release ${{ inputs.image_tag }} | by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing ACR tag to deploy (e.g. 1.2.3-build.4)"
        required: true
        type: string

permissions:
  id-token: write
  contents: read 

jobs:
  deploy_abn:
    name: "Deploy to ABN: ${{ inputs.image_tag }}"
    runs-on: ubuntu-latest
    environment: ABN
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_UAMI_CLIENT_ID_ABN }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_ABN }}

      # Deployed BEFORE core, deliberately. Core is now the only caller of this service: it proxies
      # every catalog and code-list search here, so a core that starts first is live and serving
      # searches against the previous revision of this app. The order was reversed when core stopped
      # holding its own index -- the previous comment reasoned about write forwarding only, where
      # core-first was harmless because writes simply queued.
      #
      # Guarded on the variable so a not-yet-provisioned app skips instead of failing the deploy job.
      - name: Deploy IOP IndexSearch to ABN
        if: vars.AZURE_CONTAINERAPP_NAME_INDEXSEARCH != ''
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP: ${{ vars.AZURE_CONTAINERAPP_NAME_INDEXSEARCH }}
          ACR_LOGIN: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}
          TAG: ${{ inputs.image_tag }}
          IMAGE_NAME: iop-indexsearch-api
        run: |
          IMAGE="${ACR_LOGIN}/${{ env.IMAGE_NAME }}:${TAG}"
          DEPLOYMENT_TOKEN=$(date -u +"%Y%m%d%H%M%S")
          az containerapp update \
            -g "$RG" \
            -n "$APP" \
            --image "$IMAGE" \
            --set-env-vars DEPLOYMENT_TOKEN="$DEPLOYMENT_TOKEN"

      - name: Deploy IOP Core to ABN
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP: ${{ vars.AZURE_CONTAINERAPP_NAME_CORE }}
          ACR_LOGIN: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}
          TAG: ${{ inputs.image_tag }}
          IMAGE_NAME: iop-core-api
        run: |
          IMAGE="${ACR_LOGIN}/${{ env.IMAGE_NAME }}:${TAG}"
          DEPLOYMENT_TOKEN=$(date -u +"%Y%m%d%H%M%S")
          az containerapp update \
            -g "$RG" \
            -n "$APP" \
            --image "$IMAGE" \
            --set-env-vars DEPLOYMENT_TOKEN="$DEPLOYMENT_TOKEN"

      - name: Deploy IOP Admin to ABN
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP: ${{ vars.AZURE_CONTAINERAPP_NAME_ADMIN }}
          ACR_LOGIN: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}
          TAG: ${{ inputs.image_tag }}
          IMAGE_NAME: iop-admin-api
        run: |
          IMAGE="${ACR_LOGIN}/${{ env.IMAGE_NAME }}:${TAG}"
          DEPLOYMENT_TOKEN=$(date -u +"%Y%m%d%H%M%S")
          az containerapp update \
            -g "$RG" \
            -n "$APP" \
            --image "$IMAGE" \
            --set-env-vars DEPLOYMENT_TOKEN="$DEPLOYMENT_TOKEN"

      - name: Deploy IOP Partner to ABN
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP: ${{ vars.AZURE_CONTAINERAPP_NAME_PARTNER }}
          ACR_LOGIN: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}
          TAG: ${{ inputs.image_tag }}
          IMAGE_NAME: iop-partner-api
        run: |
          IMAGE="${ACR_LOGIN}/${{ env.IMAGE_NAME }}:${TAG}"
          DEPLOYMENT_TOKEN=$(date -u +"%Y%m%d%H%M%S")
          az containerapp update \
            -g "$RG" \
            -n "$APP" \
            --image "$IMAGE" \
            --set-env-vars DEPLOYMENT_TOKEN="$DEPLOYMENT_TOKEN"

      - name: Deploy IOP Iri to ABN
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP: ${{ vars.AZURE_CONTAINERAPP_NAME_IRI }}
          ACR_LOGIN: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}
          TAG: ${{ inputs.image_tag }}
          IMAGE_NAME: iop-iri-api
        run: |
          IMAGE="${ACR_LOGIN}/${{ env.IMAGE_NAME }}:${TAG}"
          DEPLOYMENT_TOKEN=$(date -u +"%Y%m%d%H%M%S")
          az containerapp update \
            -g "$RG" \
            -n "$APP" \
            --image "$IMAGE" \
            --set-env-vars DEPLOYMENT_TOKEN="$DEPLOYMENT_TOKEN"

  deploy_prd:
    name: "Deploy to PRD: ${{ inputs.image_tag }}"
    runs-on: ubuntu-latest
    needs: deploy_abn
    environment: PRD
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_UAMI_CLIENT_ID_PRD }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_PRD }}

      # Deployed BEFORE core, deliberately. Core is now the only caller of this service: it proxies
      # every catalog and code-list search here, so a core that starts first is live and serving
      # searches against the previous revision of this app. The order was reversed when core stopped
      # holding its own index -- the previous comment reasoned about write forwarding only, where
      # core-first was harmless because writes simply queued.
      #
      # Guarded on the variable so a not-yet-provisioned app skips instead of failing the deploy job.
      - name: Deploy IOP IndexSearch to PRD
        if: vars.AZURE_CONTAINERAPP_NAME_INDEXSEARCH != ''
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP: ${{ vars.AZURE_CONTAINERAPP_NAME_INDEXSEARCH }}
          ACR_LOGIN: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}
          TAG: ${{ inputs.image_tag }}
          IMAGE_NAME: iop-indexsearch-api
        run: |
          IMAGE="${ACR_LOGIN}/${{ env.IMAGE_NAME }}:${TAG}"
          DEPLOYMENT_TOKEN=$(date -u +"%Y%m%d%H%M%S")
          az containerapp update \
            -g "$RG" \
            -n "$APP" \
            --image "$IMAGE" \
            --set-env-vars DEPLOYMENT_TOKEN="$DEPLOYMENT_TOKEN"

      - name: Deploy IOP Core to PRD
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP: ${{ vars.AZURE_CONTAINERAPP_NAME_CORE }}
          ACR_LOGIN: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}
          TAG: ${{ inputs.image_tag }}
          IMAGE_NAME: iop-core-api
        run: |
          IMAGE="${ACR_LOGIN}/${{ env.IMAGE_NAME }}:${TAG}"
          DEPLOYMENT_TOKEN=$(date -u +"%Y%m%d%H%M%S")
          az containerapp update \
            -g "$RG" \
            -n "$APP" \
            --image "$IMAGE" \
            --set-env-vars DEPLOYMENT_TOKEN="$DEPLOYMENT_TOKEN"

      - name: Deploy IOP Admin to PRD
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP: ${{ vars.AZURE_CONTAINERAPP_NAME_ADMIN }}
          ACR_LOGIN: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}
          TAG: ${{ inputs.image_tag }}
          IMAGE_NAME: iop-admin-api
        run: |
          IMAGE="${ACR_LOGIN}/${{ env.IMAGE_NAME }}:${TAG}"
          DEPLOYMENT_TOKEN=$(date -u +"%Y%m%d%H%M%S")
          az containerapp update \
            -g "$RG" \
            -n "$APP" \
            --image "$IMAGE" \
            --set-env-vars DEPLOYMENT_TOKEN="$DEPLOYMENT_TOKEN"

      - name: Deploy IOP Partner to PRD
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP: ${{ vars.AZURE_CONTAINERAPP_NAME_PARTNER }}
          ACR_LOGIN: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}
          TAG: ${{ inputs.image_tag }}
          IMAGE_NAME: iop-partner-api
        run: |
          IMAGE="${ACR_LOGIN}/${{ env.IMAGE_NAME }}:${TAG}"
          DEPLOYMENT_TOKEN=$(date -u +"%Y%m%d%H%M%S")
          az containerapp update \
            -g "$RG" \
            -n "$APP" \
            --image "$IMAGE" \
            --set-env-vars DEPLOYMENT_TOKEN="$DEPLOYMENT_TOKEN"

      - name: Deploy IOP Iri to PRD
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP: ${{ vars.AZURE_CONTAINERAPP_NAME_IRI }}
          ACR_LOGIN: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}
          TAG: ${{ inputs.image_tag }}
          IMAGE_NAME: iop-iri-api
        run: |
          IMAGE="${ACR_LOGIN}/${{ env.IMAGE_NAME }}:${TAG}"
          DEPLOYMENT_TOKEN=$(date -u +"%Y%m%d%H%M%S")
          az containerapp update \
            -g "$RG" \
            -n "$APP" \
            --image "$IMAGE" \
            --set-env-vars DEPLOYMENT_TOKEN="$DEPLOYMENT_TOKEN"

