name: i14y-backend | Deploy to ABN & PRD

run-name: "Release ${{ inputs.image_tag }} | by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing ACR tag to deploy (e.g. 1.2.3-build.4)"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

# Components are deployed one after the other, in dependency order:
#   1. AuditTrail  - Core calls it on startup
#   2. Core        - runs the database migrations
#   3. IndexSearch - reads the database migrated by Core
#   4. Admin, Partner, Iri - call the Core API
# A failed step stops the remaining ones.
jobs:
  deploy_abn:
    name: "Deploy to ABN: ${{ inputs.image_tag }}"
    runs-on: ubuntu-latest
    environment: ABN
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Validate image tag
        env:
          TAG: ${{ inputs.image_tag }}
        run: |
          # Docker tag syntax only: the tag ends up in a shell command run on AKS
          if [[ ! "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::image_tag is not a valid Docker tag."
            exit 1
          fi

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_UAMI_CLIENT_ID_ABN }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_ABN }}

      - name: Deploy AuditTrail to ABN
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP: ${{ vars.AZURE_CONTAINERAPP_NAME_AUDITTRAIL }}
          ACR_LOGIN: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}
          TAG: ${{ inputs.image_tag }}
          IMAGE_NAME: iop-audittrail-api
        run: |
          set -euo pipefail
          IMAGE="${ACR_LOGIN}/${{ env.IMAGE_NAME }}:${TAG}"
          DEPLOYMENT_TOKEN=$(date -u +"%Y%m%d%H%M%S")
          REVISION=$(az containerapp update \
            -g "$RG" \
            -n "$APP" \
            --image "$IMAGE" \
            --set-env-vars DEPLOYMENT_TOKEN="$DEPLOYMENT_TOKEN" \
            --query properties.latestRevisionName -o tsv)

          # Core calls AuditTrail on startup: wait until the new revision is healthy
          echo "Waiting for revision $REVISION to become healthy"
          deadline=$((SECONDS + 600))
          while true; do
            # tsv prints one value per line
            state=$(az containerapp revision show \
              -g "$RG" -n "$APP" --revision "$REVISION" \
              --query "[properties.provisioningState, properties.runningState, properties.healthState]" -o tsv)
            mapfile -t fields <<<"$state"
            provisioning=${fields[0]:-}
            running=${fields[1]:-}
            health=${fields[2]:-}
            echo "provisioning=$provisioning running=$running health=$health"
            if [[ "$provisioning" == "Failed" || "$running" == "Failed" ]]; then
              echo "::error::Revision $REVISION failed to start."
              exit 1
            fi
            if [[ "$health" == "Healthy" ]]; then
              break
            fi
            if (( SECONDS >= deadline )); then
              echo "::error::Revision $REVISION was not healthy after 10 minutes."
              exit 1
            fi
            sleep 10
          done

      - name: Deploy IOP Core to ABN
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP: ${{ vars.AZURE_CONTAINERAPP_NAME_CORE }}
          ACR_LOGIN: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}
          TAG: ${{ inputs.image_tag }}
          IMAGE_NAME: iop-core-api
        run: |
          set -euo pipefail
          IMAGE="${ACR_LOGIN}/${{ env.IMAGE_NAME }}:${TAG}"
          DEPLOYMENT_TOKEN=$(date -u +"%Y%m%d%H%M%S")
          REVISION=$(az containerapp update \
            -g "$RG" \
            -n "$APP" \
            --image "$IMAGE" \
            --set-env-vars DEPLOYMENT_TOKEN="$DEPLOYMENT_TOKEN" \
            --query properties.latestRevisionName -o tsv)

          # Core runs the database migrations before it starts listening, so a healthy
          # revision means the migrations are done
          echo "Waiting for revision $REVISION to become healthy"
          deadline=$((SECONDS + 600))
          while true; do
            # tsv prints one value per line
            state=$(az containerapp revision show \
              -g "$RG" -n "$APP" --revision "$REVISION" \
              --query "[properties.provisioningState, properties.runningState, properties.healthState]" -o tsv)
            mapfile -t fields <<<"$state"
            provisioning=${fields[0]:-}
            running=${fields[1]:-}
            health=${fields[2]:-}
            echo "provisioning=$provisioning running=$running health=$health"
            if [[ "$provisioning" == "Failed" || "$running" == "Failed" ]]; then
              echo "::error::Revision $REVISION failed to start."
              exit 1
            fi
            if [[ "$health" == "Healthy" ]]; then
              break
            fi
            if (( SECONDS >= deadline )); then
              echo "::error::Revision $REVISION was not healthy after 10 minutes."
              exit 1
            fi
            sleep 10
          done

      # Skipped until the AZURE_AKS_INDEXSEARCH_NAMESPACE variable is set on the ABN environment.
      - name: Deploy IndexSearch to ABN
        if: vars.AZURE_AKS_INDEXSEARCH_NAMESPACE != ''
        env:
          ACR_LOGIN: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}
          AKS_SUBSCRIPTION_ID: ${{ secrets.AZURE_AKS_SUBSCRIPTION_ID }}
          AKS_RG: ${{ vars.AZURE_AKS_RESOURCE_GROUP }}
          AKS_CLUSTER: ${{ vars.AZURE_AKS_CLUSTER_NAME }}
          TAG: ${{ inputs.image_tag }}
          NAMESPACE: ${{ vars.AZURE_AKS_INDEXSEARCH_NAMESPACE }}
          IMAGE_NAME: iop-indexsearch-api
        run: |
          set -euo pipefail
          IMAGE="${ACR_LOGIN}/${IMAGE_NAME}:${TAG}"

          echo "Rolling deployment/indexsearch in $AKS_CLUSTER ($AKS_RG) to $IMAGE"

          assert_kubectl_succeeded() {
            local output="$1" step="$2"
            echo "$output"
            if ! grep -qE 'with exitcode=[0-9]+' <<<"$output"; then
              echo "::error::$step returned no status before Azure stopped waiting; the result is unknown."
              exit 1
            fi
            if ! grep -qE 'with exitcode=0( |$)' <<<"$output"; then
              echo "::error::$step failed inside the cluster. See the output above."
              exit 1
            fi
          }

          # --subscription instead of "az account set" so the following steps stay on the ABN subscription
          patch=$(az aks command invoke --subscription "$AKS_SUBSCRIPTION_ID" -g "$AKS_RG" -n "$AKS_CLUSTER" --command \
            "kubectl -n $NAMESPACE set image deployment/indexsearch indexsearch=$IMAGE")
          assert_kubectl_succeeded "$patch" "set image"
          rollout=$(az aks command invoke --subscription "$AKS_SUBSCRIPTION_ID" -g "$AKS_RG" -n "$AKS_CLUSTER" --command \
            "kubectl -n $NAMESPACE rollout status deployment/indexsearch --timeout=300s")
          assert_kubectl_succeeded "$rollout" "rollout status"

      - name: Deploy IOP Admin to ABN
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP: ${{ vars.AZURE_CONTAINERAPP_NAME_ADMIN }}
          ACR_LOGIN: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}
          TAG: ${{ inputs.image_tag }}
          IMAGE_NAME: iop-admin-api
        run: |
          IMAGE="${ACR_LOGIN}/${{ env.IMAGE_NAME }}:${TAG}"
          DEPLOYMENT_TOKEN=$(date -u +"%Y%m%d%H%M%S")
          az containerapp update \
            -g "$RG" \
            -n "$APP" \
            --image "$IMAGE" \
            --set-env-vars DEPLOYMENT_TOKEN="$DEPLOYMENT_TOKEN"

      - name: Deploy IOP Partner to ABN
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP: ${{ vars.AZURE_CONTAINERAPP_NAME_PARTNER }}
          ACR_LOGIN: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}
          TAG: ${{ inputs.image_tag }}
          IMAGE_NAME: iop-partner-api
        run: |
          IMAGE="${ACR_LOGIN}/${{ env.IMAGE_NAME }}:${TAG}"
          DEPLOYMENT_TOKEN=$(date -u +"%Y%m%d%H%M%S")
          az containerapp update \
            -g "$RG" \
            -n "$APP" \
            --image "$IMAGE" \
            --set-env-vars DEPLOYMENT_TOKEN="$DEPLOYMENT_TOKEN"

      - name: Deploy IOP Iri to ABN
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP: ${{ vars.AZURE_CONTAINERAPP_NAME_IRI }}
          ACR_LOGIN: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}
          TAG: ${{ inputs.image_tag }}
          IMAGE_NAME: iop-iri-api
        run: |
          IMAGE="${ACR_LOGIN}/${{ env.IMAGE_NAME }}:${TAG}"
          DEPLOYMENT_TOKEN=$(date -u +"%Y%m%d%H%M%S")
          az containerapp update \
            -g "$RG" \
            -n "$APP" \
            --image "$IMAGE" \
            --set-env-vars DEPLOYMENT_TOKEN="$DEPLOYMENT_TOKEN"

  deploy_prd:
    name: "Deploy to PRD: ${{ inputs.image_tag }}"
    runs-on: ubuntu-latest
    needs: deploy_abn
    environment: PRD
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Validate image tag
        env:
          TAG: ${{ inputs.image_tag }}
        run: |
          # Docker tag syntax only: the tag ends up in a shell command run on AKS
          if [[ ! "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::image_tag is not a valid Docker tag."
            exit 1
          fi

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_UAMI_CLIENT_ID_PRD }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_PRD }}

      - name: Deploy AuditTrail to PRD
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP: ${{ vars.AZURE_CONTAINERAPP_NAME_AUDITTRAIL }}
          ACR_LOGIN: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}
          TAG: ${{ inputs.image_tag }}
          IMAGE_NAME: iop-audittrail-api
        run: |
          set -euo pipefail
          IMAGE="${ACR_LOGIN}/${{ env.IMAGE_NAME }}:${TAG}"
          DEPLOYMENT_TOKEN=$(date -u +"%Y%m%d%H%M%S")
          REVISION=$(az containerapp update \
            -g "$RG" \
            -n "$APP" \
            --image "$IMAGE" \
            --set-env-vars DEPLOYMENT_TOKEN="$DEPLOYMENT_TOKEN" \
            --query properties.latestRevisionName -o tsv)

          # Core calls AuditTrail on startup: wait until the new revision is healthy
          echo "Waiting for revision $REVISION to become healthy"
          deadline=$((SECONDS + 600))
          while true; do
            # tsv prints one value per line
            state=$(az containerapp revision show \
              -g "$RG" -n "$APP" --revision "$REVISION" \
              --query "[properties.provisioningState, properties.runningState, properties.healthState]" -o tsv)
